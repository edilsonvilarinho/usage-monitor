# O backend JVM do Kotlin estoura o heap padrão do daemon (512 MB) ao compilar
# este módulo: `OutOfMemoryError: GC overhead limit exceeded` dentro do ASM
# ("Back-end (JVM) Internal error: Couldn't transform method node").
#
# A primeira ocorrência foi atribuída ao `main()` de mais de mil linhas. Depois
# de ele ser quebrado (#298), a medida sem estas duas linhas continuou dando OOM,
# agora num composable de ~165 linhas (`BugReportHost`): o que falta é heap para
# o módulo inteiro (~72 mil linhas), não para um método. Tirar a folga volta a
# quebrar o build.
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g

# O cache de build recupera as tarefas cujas entradas nao mudaram entre uma
# execucao e a seguinte. Ele so tem efeito quando o `~/.gradle` sobrevive entre
# runs -- ver o passo "Setup Gradle" do `.github/workflows/ci.yml`, que e o que
# faz o cache do CI existir de verdade.
org.gradle.caching=true
