# O `main()` de `Main.kt` é um composable único e muito grande. O backend JVM do
# Kotlin roda análise de fluxo de controle sobre o método inteiro, e com o heap
# padrão do daemon isso estoura em `OutOfMemoryError` dentro do ASM
# ("Back-end (JVM) Internal error: Couldn't transform method node").
#
# A causa real é o tamanho de `main()`; enquanto ele não for quebrado em
# composables menores, o daemon precisa de folga para compilar o módulo.
kotlin.daemon.jvmargs=-Xmx3g
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
