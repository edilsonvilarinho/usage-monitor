services:
  team-server:
    build:
      # Contexto na raiz do repositorio, igual ao que o Dokploy usa.
      context: ..
      dockerfile: Dockerfile.dokploy
    image: usage-monitor-team-server:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATA_DIR: /data
      # Sem a chave o boot falha de proposito — nao existe modo aberto.
      TEAM_API_KEY: ${TEAM_API_KEY:?TEAM_API_KEY obrigatoria (minimo 32 caracteres)}
      TEAM_RETENTION_DAYS: ${TEAM_RETENTION_DAYS:-45}
      TEAM_MAX_TURNS_PER_REQUEST: ${TEAM_MAX_TURNS_PER_REQUEST:-5000}
      # 1 quando ha exatamente um proxy reverso na frente (caso do Dokploy).
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - team-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  team-data: {}
