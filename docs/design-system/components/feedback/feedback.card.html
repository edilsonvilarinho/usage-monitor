<!-- @dsCard group="Components" viewport="700x350" name="Feedback — banner, empty, loading, error" subtitle="Persistent banners, static skeletons, no toasts, no shimmer" -->
<!DOCTYPE html>
<html lang="pt-BR" data-app-theme="dark">
<head>
<meta charset="utf-8">
<title>Feedback</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<script src="../../_ds_local.js"></script>
<style>
  body { padding: 16px; width: 700px; }
  .grid { display: grid; gap: 12px; }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .cap { font-family: var(--mono); font-size: 10px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
let DS = {};
function Demo() {
  const { AppBanner, AppButton, AppEmptyState, AppLoadingState, AppErrorState, AppPanel } = DS;
  return (
    <div className="grid">
      <AppBanner level="warn" title="Anthropic — Padrão" action={<AppButton variant="ghost">Tentar de novo</AppButton>}>
        Limite de requisições atingido. Aguarde antes de tentar de novo.
      </AppBanner>
      <AppBanner level="crit" title="Créditos de uso indisponíveis">
        A resposta veio sem limite mensal. A linha de créditos não é exibida nesta coleta.
      </AppBanner>
      <AppBanner level="info" title="Versão 36.0.0 disponível" action={<AppButton variant="ghost">Ver release</AppButton>} />
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 12, alignItems: 'stretch' }}>
        <AppPanel><AppEmptyState message="Nenhum turno nesta janela." /></AppPanel>
        <AppPanel><AppLoadingState /></AppPanel>
        <AppPanel><AppErrorState message="Erro ao carregar histórico" action={<AppButton>Tentar novamente</AppButton>} /></AppPanel>
      </div>
    </div>
  );
}
(async () => {
  DS = await window.DSReady('../../');
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
})();
</script>
</body>
</html>
