<!-- @dsCard group="Brand" viewport="700x200" name="Monogram" subtitle="Three stems joined by a bowl — reads as U and M overlapped, keeps its silhouette at 16px" -->
<!DOCTYPE html>
<html lang="pt-BR" data-app-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; width: 700px; height: 168px; overflow: hidden; }
  .g { display: grid; gap: 8px; }
  .r { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sw { border: 1px solid var(--border); border-radius: var(--r2); overflow: hidden; }
  .sw .chip { height: 44px; }
  .sw .lab { padding: 5px 8px; font-family: var(--mono); font-size: var(--t10); display: flex; justify-content: space-between; gap: 8px; background: var(--surface); }
  .sw .lab span:last-child { color: var(--muted); }
  .k { font-family: var(--mono); font-size: var(--t10); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .st { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: var(--t10); letter-spacing: .06em; text-transform: uppercase; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .box { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r2); display: grid; place-items: center; }

</style>
</head>
<body>

<div class="r" style="align-items:flex-end;gap:20px">
  <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:6px"><img src="../assets/mark.svg" width="128" height="128" alt=""><figcaption class="k">128</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:6px"><img src="../assets/mark.svg" width="64" height="64" alt=""><figcaption class="k">64</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:6px"><img src="../assets/mark.svg" width="32" height="32" alt=""><figcaption class="k">32</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:6px"><img src="../assets/mark.svg" width="24" height="24" alt=""><figcaption class="k">24</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:6px"><img src="../assets/mark.svg" width="16" height="16" alt=""><figcaption class="k">16</figcaption></figure>
</div>
</body>
</html>
