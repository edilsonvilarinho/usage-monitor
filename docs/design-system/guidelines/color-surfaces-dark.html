<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces — dark (reference)" subtitle="Four surfaces inside ~14% luminance; depth is border + spacing, never shadow" -->
<!DOCTYPE html>
<html lang="pt-BR" data-app-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; width: 700px; height: 118px; overflow: hidden; }
  .g { display: grid; gap: 8px; }
  .r { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sw { border: 1px solid var(--border); border-radius: var(--r2); overflow: hidden; }
  .sw .chip { height: 44px; }
  .sw .lab { padding: 5px 8px; font-family: var(--mono); font-size: var(--t10); display: flex; justify-content: space-between; gap: 8px; background: var(--surface); }
  .sw .lab span:last-child { color: var(--muted); }
  .k { font-family: var(--mono); font-size: var(--t10); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .st { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: var(--t10); letter-spacing: .06em; text-transform: uppercase; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .box { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r2); display: grid; place-items: center; }

</style>
</head>
<body>
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px"><div class="sw"><div class="chip" style="background:var(--bg)"></div><div class="lab"><span>bg</span><span>--bg</span></div></div><div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="lab"><span>surface</span><span>--surface</span></div></div><div class="sw"><div class="chip" style="background:var(--raised)"></div><div class="lab"><span>raised</span><span>--raised</span></div></div><div class="sw"><div class="chip" style="background:var(--border)"></div><div class="lab"><span>border</span><span>--border</span></div></div><div class="sw"><div class="chip" style="background:var(--fg)"></div><div class="lab"><span>fg</span><span>--fg</span></div></div><div class="sw"><div class="chip" style="background:var(--muted)"></div><div class="lab"><span>muted</span><span>--muted</span></div></div></div>
</body>
</html>
