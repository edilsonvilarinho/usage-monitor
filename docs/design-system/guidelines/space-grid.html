<!-- @dsCard group="Spacing" viewport="700x150" name="4px grid" subtitle="Six steps: 4 · 8 · 12 · 16 · 24 · 32" -->
<!DOCTYPE html>
<html lang="pt-BR" data-app-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; width: 700px; height: 118px; overflow: hidden; }
  .g { display: grid; gap: 8px; }
  .r { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sw { border: 1px solid var(--border); border-radius: var(--r2); overflow: hidden; }
  .sw .chip { height: 44px; }
  .sw .lab { padding: 5px 8px; font-family: var(--mono); font-size: var(--t10); display: flex; justify-content: space-between; gap: 8px; background: var(--surface); }
  .sw .lab span:last-child { color: var(--muted); }
  .k { font-family: var(--mono); font-size: var(--t10); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .st { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: var(--t10); letter-spacing: .06em; text-transform: uppercase; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .box { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r2); display: grid; place-items: center; }

</style>
</head>
<body>

<div class="r" style="align-items:flex-end">
  <div style="text-align:center"><div style="width:var(--s1);height:56px;background:var(--fg);border-radius:2px"></div><div class="k" style="margin-top:6px">s1</div></div><div style="text-align:center"><div style="width:var(--s2);height:56px;background:var(--fg);border-radius:2px"></div><div class="k" style="margin-top:6px">s2</div></div><div style="text-align:center"><div style="width:var(--s3);height:56px;background:var(--fg);border-radius:2px"></div><div class="k" style="margin-top:6px">s3</div></div><div style="text-align:center"><div style="width:var(--s4);height:56px;background:var(--fg);border-radius:2px"></div><div class="k" style="margin-top:6px">s4</div></div><div style="text-align:center"><div style="width:var(--s6);height:56px;background:var(--fg);border-radius:2px"></div><div class="k" style="margin-top:6px">s6</div></div><div style="text-align:center"><div style="width:var(--s8);height:56px;background:var(--fg);border-radius:2px"></div><div class="k" style="margin-top:6px">s8</div></div>
</div>
</body>
</html>
