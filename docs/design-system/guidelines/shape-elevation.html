<!-- @dsCard group="Patterns" viewport="700x210" name="Elevation" subtitle="Five depth levels, two neutral shadows each; in dark the light does the work" -->
<!DOCTYPE html>
<html lang="pt-BR" data-app-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; width: 700px; height: 178px; overflow: hidden; }
  .g { display: grid; gap: 8px; }
  .r { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sw { border: 1px solid var(--border); border-radius: var(--r2); overflow: hidden; }
  .sw .chip { height: 44px; }
  .sw .lab { padding: 5px 8px; font-family: var(--mono); font-size: var(--t10); display: flex; justify-content: space-between; gap: 8px; background: var(--surface); }
  .sw .lab span:last-child { color: var(--muted); }
  .k { font-family: var(--mono); font-size: var(--t10); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .st { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: var(--t10); letter-spacing: .06em; text-transform: uppercase; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .box { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r2); display: grid; place-items: center; }

</style>
</head>
<body>

<div class="r" style="gap:16px">
  <div style="text-align:center"><div class="box" style="width:112px;height:56px;border-radius:var(--r3)"><span class="k">flat</span></div><div class="k" style="margin-top:6px">linha, bloco</div></div>
  <div style="text-align:center"><div class="box" style="width:112px;height:56px;border-radius:var(--r3);background:linear-gradient(var(--sheen),transparent 56px),var(--surface);border-color:var(--border-top) var(--border) var(--border-bottom);box-shadow:inset 0 1px 0 var(--highlight),var(--shadow-card)"><span class="k">card</span></div><div class="k" style="margin-top:6px">painel, card</div></div>
  <div style="text-align:center"><div class="box" style="width:112px;height:56px;border-radius:var(--r3);box-shadow:inset 0 1px 0 var(--highlight),var(--shadow-raised);transform:translateY(-1px)"><span class="k">raised</span></div><div class="k" style="margin-top:6px">hover, tooltip</div></div>
  <div style="text-align:center"><div class="box" style="width:112px;height:56px;border-radius:var(--r2);box-shadow:var(--shadow-overlay)"><span class="k">overlay</span></div><div class="k" style="margin-top:6px">menu</div></div>
  <div style="text-align:center"><div class="box" style="width:112px;height:56px;border-radius:var(--r3);box-shadow:var(--shadow-dialog)"><span class="k">dialog</span></div><div class="k" style="margin-top:6px">arrasto, HUD</div></div>
</div>
<div style="font-family:var(--sans);font-size:var(--t12);color:var(--muted);border-left:2px solid var(--border);padding-left:12px;margin-top:12px;max-width:640px">Cada patamar são duas sombras neutras (<code style="border:0;background:none;padding:0;color:var(--fg)">AppDepth</code>). No escuro a sombra preta quase não aparece — medido: 10dp escurecem <code style="border:0;background:none;padding:0;color:var(--fg)">#131010</code> em 3/255 —, e o volume vem da luz: highlight, brilho e borda clara no topo.</div>
</body>
</html>
