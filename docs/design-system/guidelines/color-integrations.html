<!-- @dsCard group="Colors" viewport="700x200" name="Integration accents" subtitle="Six fixed accents: AA 4.5:1 on both surfaces, hue preserved, ≥20° apart" -->
<!DOCTYPE html>
<html lang="pt-BR" data-app-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; width: 700px; height: 168px; overflow: hidden; }
  .g { display: grid; gap: 8px; }
  .r { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sw { border: 1px solid var(--border); border-radius: var(--r2); overflow: hidden; }
  .sw .chip { height: 44px; }
  .sw .lab { padding: 5px 8px; font-family: var(--mono); font-size: var(--t10); display: flex; justify-content: space-between; gap: 8px; background: var(--surface); }
  .sw .lab span:last-child { color: var(--muted); }
  .k { font-family: var(--mono); font-size: var(--t10); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .st { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: var(--t10); letter-spacing: .06em; text-transform: uppercase; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .box { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r2); display: grid; place-items: center; }

</style>
</head>
<body>

<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px">
  <div class="sw"><div class="chip" style="background:var(--anthropic)"></div><div class="lab"><span>anthropic</span><span>--anthropic</span></div></div><div class="sw"><div class="chip" style="background:var(--codex)"></div><div class="lab"><span>codex</span><span>--codex</span></div></div><div class="sw"><div class="chip" style="background:var(--deepseek)"></div><div class="lab"><span>deepseek</span><span>--deepseek</span></div></div><div class="sw"><div class="chip" style="background:var(--minimax)"></div><div class="lab"><span>minimax</span><span>--minimax</span></div></div><div class="sw"><div class="chip" style="background:var(--oc)"></div><div class="lab"><span>oc</span><span>--oc</span></div></div><div class="sw"><div class="chip" style="background:var(--kilo)"></div><div class="lab"><span>kilo</span><span>--kilo</span></div></div>
</div>
<div class="r" style="margin-top:14px">
  <span class="k">área de uso</span>
  <span style="width:2px;height:22px;background:var(--anthropic);border-radius:1px"></span>
  <span class="k" style="color:var(--fg);font-family:var(--mono);text-transform:none;letter-spacing:0;font-size:var(--t12)">marcador de 2px no painel</span>
  <span class="k">·</span>
  <span class="k" style="text-transform:none;letter-spacing:0;font-size:var(--t12)">linha de gráfico</span>
  <span class="k">·</span>
  <span class="k" style="text-transform:none;letter-spacing:0;font-size:var(--t12)">texto de valor</span>
</div>
</body>
</html>
