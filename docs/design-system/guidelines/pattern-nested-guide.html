<!-- @dsCard group="Patterns" viewport="700x200" name="Nested group guide" subtitle="Children of an expanded row are siblings in the list — the 2dp stroke says they belong to it" -->
<!DOCTYPE html>
<html lang="pt-BR" data-app-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; width: 700px; height: 168px; overflow: hidden; }
  .g { display: grid; gap: 8px; }
  .r { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sw { border: 1px solid var(--border); border-radius: var(--r2); overflow: hidden; }
  .sw .chip { height: 44px; }
  .sw .lab { padding: 5px 8px; font-family: var(--mono); font-size: var(--t10); display: flex; justify-content: space-between; gap: 8px; background: var(--surface); }
  .sw .lab span:last-child { color: var(--muted); }
  .k { font-family: var(--mono); font-size: var(--t10); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .st { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: var(--t10); letter-spacing: .06em; text-transform: uppercase; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .box { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r2); display: grid; place-items: center; }

</style>
</head>
<body>

<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--r3);overflow:hidden">
  <div style="display:flex;align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--border)">
    <span style="width:2px;align-self:stretch;min-height:20px;background:var(--anthropic);border-radius:1px"></span>
    <span style="font-family:var(--mono);font-size:var(--t12);color:var(--muted)">▾</span>
    <div style="display:flex;flex-direction:column"><span style="font-family:var(--mono);font-size:var(--t12)">dev-01</span><span class="k">DESKTOP-A1</span></div>
    <span style="flex:1"></span><span style="font-family:var(--mono);font-size:var(--t12);font-variant-numeric:tabular-nums">US$ 4,8120</span>
  </div>
  
  <div style="display:flex;align-items:center;gap:12px;padding:8px 12px 8px 38px;margin-left:24px;border-left:2px solid var(--border);background:var(--bg);border-bottom:1px solid var(--border)">
    <div style="display:flex;flex-direction:column"><span style="font-family:var(--mono);font-size:var(--t12)">7c4a1f92</span><span class="k">api-gateway · 48 turnos</span></div>
    <span style="flex:1"></span><span style="font-family:var(--mono);font-size:var(--t12);font-variant-numeric:tabular-nums">US$ 3,1841</span>
  </div>
  <div style="display:flex;align-items:center;gap:12px;padding:8px 12px 8px 38px;margin-left:24px;border-left:2px solid var(--border);background:var(--bg);">
    <div style="display:flex;flex-direction:column"><span style="font-family:var(--mono);font-size:var(--t12)">b81e35c0</span><span class="k">checkout-web · 26 turnos</span></div>
    <span style="flex:1"></span><span style="font-family:var(--mono);font-size:var(--t12);font-variant-numeric:tabular-nums">US$ 1,6279</span>
  </div>
</div>
<div class="k" style="margin-top:8px">traço desenhado por item · sai contínuo porque a lista não tem vão · drawBehind, não Modifier.border</div>
</body>
</html>
