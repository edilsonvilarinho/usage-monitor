<!-- @dsCard group="Brand" viewport="700x160" name="Tray badge" subtitle="Risk dot over the tray icon; ON_TRACK lights nothing — a permanent green dot is decoration. Optional usage ring (#328): highest current quota, light gray below 75%" -->
<!DOCTYPE html>
<html lang="pt-BR" data-app-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; width: 700px; height: 128px; overflow: hidden; }
  .g { display: grid; gap: 8px; }
  .r { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sw { border: 1px solid var(--border); border-radius: var(--r2); overflow: hidden; }
  .sw .chip { height: 44px; }
  .sw .lab { padding: 5px 8px; font-family: var(--mono); font-size: var(--t10); display: flex; justify-content: space-between; gap: 8px; background: var(--surface); }
  .sw .lab span:last-child { color: var(--muted); }
  .k { font-family: var(--mono); font-size: var(--t10); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .st { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: var(--t10); letter-spacing: .06em; text-transform: uppercase; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .box { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r2); display: grid; place-items: center; }

</style>
</head>
<body>

<div class="r" style="gap:24px">
  <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:6px"><svg width="32" height="32" viewBox="0 0 24 24"><image href="../assets/app-icon-tray.png" width="24" height="24"/></svg><figcaption class="k">normal</figcaption></figure>
  <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:6px"><svg width="32" height="32" viewBox="0 0 24 24"><image href="../assets/app-icon-tray.png" width="24" height="24"/><circle cx="19" cy="19" r="5" fill="var(--warn)" stroke="#131010" stroke-width="1.6"/></svg><figcaption class="k">atenção</figcaption></figure>
  <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:6px"><svg width="32" height="32" viewBox="0 0 24 24"><image href="../assets/app-icon-tray.png" width="24" height="24"/><circle cx="19" cy="19" r="5" fill="var(--crit)" stroke="#131010" stroke-width="1.6"/></svg><figcaption class="k">crítico</figcaption></figure>
  <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:6px"><svg width="32" height="32" viewBox="0 0 24 24"><image href="../assets/app-icon-tray.png" width="24" height="24"/><circle cx="12" cy="12" r="10.3" fill="none" stroke="#101010" stroke-width="3.4"/><circle cx="12" cy="12" r="10.3" fill="none" stroke="#E0E0E0" stroke-width="3.4" stroke-dasharray="26.54 64.72" transform="rotate(-90 12 12)"/></svg><figcaption class="k">anel 41%</figcaption></figure>
  <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:6px"><svg width="32" height="32" viewBox="0 0 24 24"><image href="../assets/app-icon-tray.png" width="24" height="24"/><circle cx="12" cy="12" r="10.3" fill="none" stroke="#101010" stroke-width="3.4"/><circle cx="12" cy="12" r="10.3" fill="none" stroke="var(--crit)" stroke-width="3.4" stroke-dasharray="60.84 64.72" transform="rotate(-90 12 12)"/></svg><figcaption class="k">anel 94%</figcaption></figure>
</div>
</body>
</html>
