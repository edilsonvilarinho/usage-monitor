<!-- @dsCard group="Patterns" viewport="700x180" name="Glyph set" subtitle="Unicode marks in IBM Plex Mono, no icon font, no emoji — each carries an aria-label" -->
<!DOCTYPE html>
<html lang="pt-BR" data-app-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; width: 700px; height: 148px; overflow: hidden; }
  .g { display: grid; gap: 8px; }
  .r { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sw { border: 1px solid var(--border); border-radius: var(--r2); overflow: hidden; }
  .sw .chip { height: 44px; }
  .sw .lab { padding: 5px 8px; font-family: var(--mono); font-size: var(--t10); display: flex; justify-content: space-between; gap: 8px; background: var(--surface); }
  .sw .lab span:last-child { color: var(--muted); }
  .k { font-family: var(--mono); font-size: var(--t10); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .st { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: var(--t10); letter-spacing: .06em; text-transform: uppercase; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .box { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r2); display: grid; place-items: center; }

</style>
</head>
<body>

<div class="r" style="gap:10px">
  <figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:5px"><span class="box" style="width:26px;height:26px;border-radius:var(--r2);font-family:var(--mono);font-size:var(--t12);color:var(--muted)">↻</span><figcaption class="k" style="font-size:9px">Atualizar</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:5px"><span class="box" style="width:26px;height:26px;border-radius:var(--r2);font-family:var(--mono);font-size:var(--t12);color:var(--muted)">–</span><figcaption class="k" style="font-size:9px">Minimizar</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:5px"><span class="box" style="width:26px;height:26px;border-radius:var(--r2);font-family:var(--mono);font-size:var(--t12);color:var(--muted)">+</span><figcaption class="k" style="font-size:9px">Expandir</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:5px"><span class="box" style="width:26px;height:26px;border-radius:var(--r2);font-family:var(--mono);font-size:var(--t12);color:var(--muted)">×</span><figcaption class="k" style="font-size:9px">Fechar</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:5px"><span class="box" style="width:26px;height:26px;border-radius:var(--r2);font-family:var(--mono);font-size:var(--t12);color:var(--muted)">□</span><figcaption class="k" style="font-size:9px">Maximizar</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:5px"><span class="box" style="width:26px;height:26px;border-radius:var(--r2);font-family:var(--mono);font-size:var(--t12);color:var(--muted)">⏱</span><figcaption class="k" style="font-size:9px">Histórico</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:5px"><span class="box" style="width:26px;height:26px;border-radius:var(--r2);font-family:var(--mono);font-size:var(--t12);color:var(--muted)">▣</span><figcaption class="k" style="font-size:9px">Sessões CLI</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:5px"><span class="box" style="width:26px;height:26px;border-radius:var(--r2);font-family:var(--mono);font-size:var(--t12);color:var(--muted)">◫</span><figcaption class="k" style="font-size:9px">Uso do time</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:5px"><span class="box" style="width:26px;height:26px;border-radius:var(--r2);font-family:var(--mono);font-size:var(--t12);color:var(--muted)">◉</span><figcaption class="k" style="font-size:9px">Conectados agora</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:5px"><span class="box" style="width:26px;height:26px;border-radius:var(--r2);font-family:var(--mono);font-size:var(--t12);color:var(--muted)">▾</span><figcaption class="k" style="font-size:9px">Recolher</figcaption></figure><figure style="margin:0;display:flex;flex-direction:column;align-items:center;gap:5px"><span class="box" style="width:26px;height:26px;border-radius:var(--r2);font-family:var(--mono);font-size:var(--t12);color:var(--muted)">·</span><figcaption class="k" style="font-size:9px">Vazio</figcaption></figure>
</div>
<div style="font-family:var(--sans);font-size:var(--t12);color:var(--muted);border-left:2px solid var(--border);padding-left:12px;margin-top:14px">Sem biblioteca de ícones. O app não embute fonte de ícone nem sprite SVG: os glifos vêm da própria IBM Plex Mono, que já está carregada, e a semântica vive no <code style="border:0;background:none;padding:0;color:var(--fg)">contentDescription</code>.</div>
</body>
</html>
