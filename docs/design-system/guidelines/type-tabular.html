<!-- @dsCard group="Type" viewport="700x220" name="Tabular numerals" subtitle="Every number in the app is tabular-nums; money and tokens are right-aligned" -->
<!DOCTYPE html>
<html lang="pt-BR" data-app-theme="dark">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px; width: 700px; height: 188px; overflow: hidden; }
  .g { display: grid; gap: 8px; }
  .r { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .sw { border: 1px solid var(--border); border-radius: var(--r2); overflow: hidden; }
  .sw .chip { height: 44px; }
  .sw .lab { padding: 5px 8px; font-family: var(--mono); font-size: var(--t10); display: flex; justify-content: space-between; gap: 8px; background: var(--surface); }
  .sw .lab span:last-child { color: var(--muted); }
  .k { font-family: var(--mono); font-size: var(--t10); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
  .st { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: var(--t10); letter-spacing: .06em; text-transform: uppercase; }
  .st::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .box { border: 1px solid var(--border); background: var(--surface); border-radius: var(--r2); display: grid; place-items: center; }

</style>
</head>
<body>

<table style="width:100%;border-collapse:collapse;font-family:var(--mono);font-size:var(--t12)">
  <tr><th style="text-align:left;padding:6px 12px;border-bottom:1px solid var(--border)" class="k">Projeto</th><th style="text-align:right;padding:6px 12px;border-bottom:1px solid var(--border)" class="k">Tokens</th><th style="text-align:right;padding:6px 12px;border-bottom:1px solid var(--border)" class="k">Custo</th><th style="text-align:right;padding:6px 12px;border-bottom:1px solid var(--border)" class="k">Tempo ativo</th></tr>
  <tr><td style="padding:7px 12px;border-bottom:1px solid var(--border)">api-gateway</td><td style="padding:7px 12px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums">1 284 000</td><td style="padding:7px 12px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums">US$ 3,1841</td><td style="padding:7px 12px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums">2h 41m</td></tr>
  <tr><td style="padding:7px 12px;border-bottom:1px solid var(--border)">checkout-web</td><td style="padding:7px 12px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums">612 400</td><td style="padding:7px 12px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums">US$ 1,6279</td><td style="padding:7px 12px;border-bottom:1px solid var(--border);text-align:right;font-variant-numeric:tabular-nums">1h 08m</td></tr>
  <tr><td style="padding:7px 12px">infra-terraform</td><td style="padding:7px 12px;text-align:right;font-variant-numeric:tabular-nums">208 100</td><td style="padding:7px 12px;text-align:right;font-variant-numeric:tabular-nums">US$ 0,1904</td><td style="padding:7px 12px;text-align:right;font-variant-numeric:tabular-nums">0h 22m</td></tr>
</table>
<div class="k" style="margin-top:10px">pt-BR: vírgula decimal, espaço fino no milhar, moeda com US$</div>
</body>
</html>
