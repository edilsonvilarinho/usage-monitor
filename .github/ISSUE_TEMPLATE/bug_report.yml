name: Bug report
description: Something is broken or behaves differently from what is documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do **not** paste API keys, OAuth tokens or the contents of
        `~/.claude/.credentials.json`, `~/.codex/auth.json`, `~/.usage-monitor/api-keys.json` or
        `~/.usage-monitor/team.json`.

        Found a security problem? Do not open an issue — see
        [SECURITY.md](https://github.com/edilsonvilarinho/usage-monitor/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings, or in the window title. For example `38.0.2`.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - macOS
    validations:
      required: true

  - type: input
    id: os-detail
    attributes:
      label: OS version and how you installed
      description: "For example: Windows 11 24H2, installed with UsageMonitor-Setup.exe. Or: Fedora 41, installed with the .rpm."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Dashboard / a specific integration
        - Claude Code sessions or usage breakdown
        - History and forecast
        - Alerts and tray
        - Export or PDF report
        - Team integration
        - Auto-update or installation
        - Settings / appearance
        - Something else
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Diagnostics
      description: |
        If the problem is with startup or with an update, attach the relevant file from
        `~/.usage-monitor/diagnostics/` — `startup.jsonl`, or `linux-update.log` on Linux.
        Screenshots help for anything visual.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I am on the latest release, or I checked that this is still open there.
          required: true
        - label: This report contains no keys, tokens or credential file contents.
          required: true
