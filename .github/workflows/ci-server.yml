name: CI Server

# Workflow separado do `ci.yml`: outra suite em outro runner (Node em ubuntu
# contra Compose em windows). O recorte por path e feito dentro do job, sem
# nenhuma action de terceiros.
on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/ci-server.yml'
  # Sem filtro de path no `pull_request`, de proposito. Um workflow que o filtro
  # impede de disparar nunca reporta status, e um check obrigatorio nessa
  # condicao trava o PR em "Expected - Waiting for status to be reported". O
  # recorte por path passou para dentro do job, que assim sempre reporta
  # `success` de verdade — sem depender de a protecao de branch tratar um job
  # `skipped` como sucesso.
  pull_request:

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    defaults:
      run:
        working-directory: server

    steps:
      # `working-directory: .` sobrescreve o default do job: este step roda antes
      # do checkout, e `server/` ainda nao existe no runner.
      - name: Detect relevant changes
        id: filter
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Push so chega ate aqui quando o `paths` do gatilho ja aprovou.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')"

          relevant=false
          changed=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            changed=$((changed + 1))
            # Mesmo recorte do `paths` do gatilho de push.
            case "$file" in
              server/*|.github/workflows/ci-server.yml) ;;
              *) continue ;;
            esac
            echo "Server change: $file"
            relevant=true
          done <<< "$files"

          # Sem `break` no laco: a contagem completa entra no resumo do job, e e
          # ela que diz quantos arquivos foram avaliados quando a suite nao roda.
          echo "relevant=$relevant changed=$changed"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # Checkout sem condicao: `tools/ci/test-summary.mjs` precisa existir no disco
      # tambem no ramo em que a suite nao roda, que e justamente o que ele tem de
      # anunciar.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Par do step de mesmo nome em `ci.yml`: os filtros de path dos dois
      # workflows sao disjuntos, entao a guarda precisa de um step em cada um.
      # Aqui ela cobre a edicao que mexe so em `server/src/domain/modelPricing.ts`.
      # `working-directory: .` porque o default do job e `server`, e o script le os
      # dois arquivos a partir da raiz do repositorio.
      - name: Check pricing table parity
        if: steps.filter.outputs.relevant == 'true'
        working-directory: .
        run: node tools/ci/check-pricing-parity.mjs

      - name: Setup Node
        if: steps.filter.outputs.relevant == 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # `server/package.json` declara engines.node >=20.
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.relevant == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.filter.outputs.relevant == 'true'
        run: npm run typecheck

      # `test:ci` e o `vitest run` com o reporter JUnit ligado. O resumo do job sai
      # do mesmo XML que o job do desktop usa, com o mesmo parser -- duas
      # implementacoes divergiriam justamente na contagem.
      - name: Run tests
        if: steps.filter.outputs.relevant == 'true'
        run: npm run test:ci

      # Sai em TODO run, verde inclusive: foi um "Successful in 5s" deste job,
      # com zero teste executado, que abriu a issue #93. O `--require` derruba o
      # job quando a suite devia rodar e nao produziu XML nenhum.
      - name: Publish test summary
        if: always() && steps.filter.outputs.relevant == 'true'
        working-directory: .
        run: node tools/ci/test-summary.mjs --title "Servidor de time" --glob "server/test-results/*.xml" --require

      - name: Report skipped suite
        if: steps.filter.outputs.relevant != 'true'
        working-directory: .
        run: |
          node tools/ci/test-summary.mjs             --title "Servidor de time"             --skipped "nenhuma mudanca em server/ nem no proprio workflow"             --evaluated "${{ steps.filter.outputs.changed }}"

      - name: Upload test reports
        if: always() && steps.filter.outputs.relevant == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-server
          path: server/test-results/**
          if-no-files-found: ignore
          retention-days: 7
