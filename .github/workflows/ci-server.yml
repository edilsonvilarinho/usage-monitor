name: CI Server

# Workflow separado do `ci.yml`: outra suite em outro runner (Node em ubuntu
# contra Compose em windows). O recorte por path e feito dentro do job, sem
# nenhuma action de terceiros.
on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/ci-server.yml'
  # Sem filtro de path no `pull_request`, de proposito. Um workflow que o filtro
  # impede de disparar nunca reporta status, e um check obrigatorio nessa
  # condicao trava o PR em "Expected - Waiting for status to be reported". O
  # recorte por path passou para dentro do job, que assim sempre reporta
  # `success` de verdade — sem depender de a protecao de branch tratar um job
  # `skipped` como sucesso.
  pull_request:

concurrency:
  group: ci-server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    defaults:
      run:
        working-directory: server

    steps:
      # `working-directory: .` sobrescreve o default do job: este step roda antes
      # do checkout, e `server/` ainda nao existe no runner.
      - name: Detect relevant changes
        id: filter
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Push so chega ate aqui quando o `paths` do gatilho ja aprovou.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')"

          relevant=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            # Mesmo recorte do `paths` do gatilho de push.
            case "$file" in
              server/*|.github/workflows/ci-server.yml) ;;
              *) continue ;;
            esac
            echo "Server change: $file"
            relevant=true
            break
          done <<< "$files"

          echo "relevant=$relevant"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.filter.outputs.relevant == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.filter.outputs.relevant == 'true'
        uses: actions/setup-node@v4
        with:
          # `server/package.json` declara engines.node >=20.
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        if: steps.filter.outputs.relevant == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.filter.outputs.relevant == 'true'
        run: npm run typecheck

      - name: Run tests
        if: steps.filter.outputs.relevant == 'true'
        run: npm test
