name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'server/**'
      - 'docs/**'
      - '**.md'
  # Sem filtro de path no `pull_request`, de proposito. Um workflow que o filtro
  # impede de disparar nunca reporta status, e um check obrigatorio nessa
  # condicao trava o PR em "Expected - Waiting for status to be reported". O
  # recorte por path passou para dentro do job, que assim sempre reporta
  # `success` de verdade — sem depender de a protecao de branch tratar um job
  # `skipped` como sucesso.
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    # windows-latest, nao ubuntu: os testes de componente usam
    # `runDesktopComposeUiTest` e nunca rodaram headless em Linux. O repositorio
    # nao tem nenhuma configuracao de headless/xvfb, entao um alvo Linux seria
    # um gate nao comprovado.
    runs-on: windows-latest

    permissions:
      contents: read
      pull-requests: read

    steps:
      # Recorte por path feito aqui, e nao no gatilho. `gh` ja vem instalado no
      # runner: nenhuma action de terceiros entra no caminho.
      - name: Detect relevant changes
        id: filter
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Push so chega ate aqui quando o `paths-ignore` do gatilho ja aprovou.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')"

          relevant=false
          changed=0
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            changed=$((changed + 1))
            # Mesmo recorte do `paths-ignore` do gatilho de push.
            case "$file" in
              server/*|docs/*|*.md) continue ;;
            esac
            echo "Desktop change: $file"
            relevant=true
          done <<< "$files"

          # Sem `break` no laco: a contagem completa entra no resumo do job, e e
          # ela que diz quantos arquivos foram avaliados quando a suite nao roda.
          echo "relevant=$relevant changed=$changed"
          echo "relevant=$relevant" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      # Checkout sem condicao: `tools/ci/test-summary.mjs` precisa existir no disco
      # tambem no ramo em que a suite nao roda, que e justamente o que ele tem de
      # anunciar. Sao ~5 s.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        if: steps.filter.outputs.relevant == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # O cache do Gradle NAO fica no `setup-java`. O post-step dele arquiva o
      # `~/.gradle` com o daemon ainda vivo, e no Windows o tar falha nos `.lock`
      # (`Device or resource busy`, e no run 32780176169 um
      # `tar.exe failed with exit code 2`). O efeito era total e silencioso: todo
      # run desde 23/08 comecava com `gradle cache is not found`, e
      # `gh cache list` nao tinha UMA entrada Windows -- so as quatro do macOS,
      # gravadas pelo release. Os ~57 s que o job gastava antes da primeira tarefa
      # eram download; a mesma fase custa 0,44 s na maquina de desenvolvimento.
      #
      # Esta action para o daemon antes de arquivar e exclui os locks. E da
      # Gradle Inc., e o job `build-windows` do release ja usa a antecessora dela
      # (`gradle/gradle-build-action`), entao nao e precedente novo no repositorio.
      - name: Setup Gradle
        if: steps.filter.outputs.relevant == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          # So a `main` escreve. Cache gravado num run de PR fica com o escopo
          # daquele PR e nenhum outro run consegue le-lo: seria pagar a gravacao
          # sem nunca cobrar o proveito.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # MINIMAX_API_KEY fica deliberadamente indefinida: os testes injetam o
      # leitor da env var e `MiniMaxRepositoryImplTest` afirma a mensagem de
      # variavel ausente. Defini-la aqui quebraria o teste.
      - name: Run tests
        if: steps.filter.outputs.relevant == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat allTests --build-cache

      # O resumo sai em TODO run, verde inclusive. Um check que so diz
      # "Successful in 5m" nao permite saber se a suite rodou -- foi um verde de
      # 5 s, com zero teste executado, que abriu a issue #93. O `--require`
      # derruba o job quando a suite devia rodar e nao produziu XML nenhum: e o
      # unico jeito de "passou sem executar" ficar vermelho.
      - name: Publish test summary
        if: always() && steps.filter.outputs.relevant == 'true'
        shell: pwsh
        run: node tools/ci/test-summary.mjs --title "Desktop (allTests)" --glob "build/test-results/**/*.xml" --require

      - name: Report skipped suite
        if: steps.filter.outputs.relevant != 'true'
        shell: pwsh
        run: |
          node tools/ci/test-summary.mjs `
            --title "Desktop (allTests)" `
            --skipped "nenhum arquivo fora de server/, docs/ e *.md" `
            --evaluated "${{ steps.filter.outputs.changed }}"

      # Sobe sempre, nao so no `failure()`: sem o XML guardado nao ha como
      # comparar duracao entre runs nem investigar intermitencia depois do fato.
      - name: Upload test reports
        if: always() && steps.filter.outputs.relevant == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/**
            build/test-results/**
          if-no-files-found: ignore
          retention-days: 7

  # Job separado do `tests` de proposito: o roteiro instala e desinstala de
  # verdade, mexe no registro do runner e leva alguns minutos. Amarra-lo ao job
  # rapido faria toda mudanca de Kotlin esperar por ele.
  #
  # O `allTests` NAO cobre nada disto: o modo /UPDATE e script NSIS, e a unica
  # forma de exercita-lo e compilar o instalador e roda-lo. Foi exatamente assim
  # que os dois defeitos da atividade A16 apareceram -- nenhum deles seria pego
  # lendo o codigo.
  installer-scenarios:
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        # fetch-depth: 0 porque o filtro abaixo usa diff de tres pontos, que
        # precisa de base comum. Com o checkout raso padrao e um fetch --depth=1
        # da base, as duas historias nao se tocam e o git responde
        # `fatal: ...: no merge base` -- o passo falha, o job falha, e os cenarios
        # NUNCA rodam. Aconteceu de verdade: o CI do PR #85 ficou vermelho por
        # isto, e o defeito ja estava catalogado como P1-09 na contra-auditoria.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect installer changes
        id: filter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ github.event_name }}' -ne 'pull_request') {
            "relevant=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          git fetch --no-tags origin '${{ github.event.pull_request.base.ref }}'
          $changed = git diff --name-only "origin/${{ github.event.pull_request.base.ref }}...HEAD"
          # Falha do git nao pode virar "nada mudou": com ErrorActionPreference
          # Stop o pwsh NAO aborta em comando nativo, entao o filtro seguiria com
          # a lista vazia e pularia os cenarios em silencio. Na duvida, roda.
          if ($LASTEXITCODE -ne 0) {
            Write-Host "git diff falhou ($LASTEXITCODE); rodando os cenarios por precaucao."
            "relevant=true" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $relevant = $false
          foreach ($file in $changed) {
            if ($file -like 'src/installer/*' -or $file -like 'src/desktopMain/kotlin/com/usagemonitor/update/*') {
              Write-Host "Installer-related change: $file"
              $relevant = $true
              break
            }
          }
          "relevant=$($relevant.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Install NSIS
        if: steps.filter.outputs.relevant == 'true'
        shell: pwsh
        run: choco install nsis -y

      # So o cenario S7 usa: ele compila um MSI minimo para o instalador
      # encontrar e remover. Sem WiX o roteiro pula esse cenario com aviso em vez
      # de falhar, entao este passo e o que faz o S7 rodar de verdade aqui.
      - name: Install WiX
        if: steps.filter.outputs.relevant == 'true'
        shell: pwsh
        run: choco install wixtoolset -y

      - name: Run installer update scenarios
        if: steps.filter.outputs.relevant == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\src\installer\test\Invoke-UpdateScenarios.ps1
