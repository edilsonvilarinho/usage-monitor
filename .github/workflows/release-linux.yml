name: Release Linux Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle_version: 8.6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build Linux distributable
        run: ./gradlew createDistributable

      - name: Find AppImage
        id: appimage
        run: |
          APPIMAGE=$(find build -name "*.AppImage" -type f | head -1 || true)
          echo "path=$APPIMAGE" >> $GITHUB_OUTPUT

      - name: Package as deb
        if: steps.appimage.outputs.path != ''
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev

          APPIMAGE="${{ steps.appimage.outputs.path }}"
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p dist-build

          chmod +x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract > /dev/null 2>&1 || true

          PKG_DIR="sqfs-root"
          mkdir -p "$PKG_DIR/DEBIAN"
          mkdir -p "$PKG_DIR/usr/bin"
          mkdir -p "$PKG_DIR/usr/share/applications"

          cp -r squashfs-root/* "$PKG_DIR/" 2>/dev/null || true

          printf 'Package: usage-monitor\nVersion: %s\nSection: utils\nPriority: optional\nArchitecture: amd64\nMaintainer: Usage Monitor\nDescription: Usage Monitor - API usage tracker\n' "$VERSION" > "$PKG_DIR/DEBIAN/control"

          printf '[Desktop Entry]\nName=Usage Monitor\nComment=API usage tracker\nExec=%s/usage-monitor\nIcon=usage-monitor\nTerminal=false\nType=Application\n' "$PKG_DIR" > "$PKG_DIR/usr/share/applications/usage-monitor.desktop"

          dpkg-deb --build --root-owner-group "$PKG_DIR" "dist-build/usage-monitor_${VERSION}_amd64.deb"

      - name: Create RPM package
        if: steps.appimage.outputs.path != ''
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm

          APPIMAGE="${{ steps.appimage.outputs.path }}"
          VERSION="${{ steps.version.outputs.VERSION }}"
          mkdir -p dist-build/rpmtmp/BUILD
          mkdir -p dist-build/rpmtmp/RPMS
          mkdir -p dist-build/rpmtmp/SPECS
          mkdir -p dist-build/rpmtmp/SOURCES

          printf 'Name: usage-monitor\nVersion: %s\nRelease: 1\nSummary: Usage Monitor - API usage tracker\nLicense: MIT\nBuildArch: x86_64\n\n%%%%description\nUsage Monitor - API usage tracker\n\n%%%%install\nmkdir -p %%{buildroot}/usr/bin\nmkdir -p %%{buildroot}/usr/share/applications\n\ncp %s %%{buildroot}/usr/bin/usage-monitor\nchmod +x %%{buildroot}/usr/bin/usage-monitor\n\n%%%%files\n/usr/bin/usage-monitor\n/usr/share/applications/usage-monitor.desktop\n' "$VERSION" "$APPIMAGE" > dist-build/rpmtmp/SPECS/usage-monitor.spec

          rpmbuild --define "_topdir $(pwd)/dist-build/rpmtmp" -bb dist-build/rpmtmp/SPECS/usage-monitor.spec || true
          ls -la dist-build/rpmtmp/RPMS/x86_64/ 2>/dev/null || echo "RPM build may have failed"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/**/*.AppImage
            dist-build/*.deb
            dist-build/*.rpm