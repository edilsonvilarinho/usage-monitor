name: Release Desktop Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot rpm

      - name: Build Linux release artifacts
        run: |
          set -euo pipefail
          ./gradlew createDistributable packageDistributionForCurrentOS

          VERSION="${{ steps.version.outputs.VERSION }}"
          APP_ROOT="build/compose/binaries/main/app"
          APP_DIR="$APP_ROOT/Usage Monitor"
          mkdir -p dist-build

          if [ ! -d "$APP_DIR" ]; then
            echo "Expected distributable directory not found: $APP_DIR" >&2
            exit 1
          fi

          tar -C "$APP_ROOT" -czf "dist-build/usage-monitor_${VERSION}_linux_x64.tar.gz" "Usage Monitor"
          find build/compose/binaries -type f \( -name "*.deb" -o -name "*.rpm" \) -exec cp {} dist-build/ \;
          ls -la dist-build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist-build/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.6

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat createDistributable packageDistributionForCurrentOS

          $version = "${{ steps.version.outputs.VERSION }}"
          $appRoot = "build\compose\binaries\main\app"
          $appDir = Join-Path $appRoot "Usage Monitor"

          New-Item -ItemType Directory -Force -Path dist-build | Out-Null

          if (-not (Test-Path $appDir)) {
            throw "Expected distributable directory not found: $appDir"
          }

          Compress-Archive -Path "$appDir\*" -DestinationPath "dist-build\usage-monitor_${version}_windows_x64.zip" -Force
          Get-ChildItem -Recurse -File build\compose\binaries -Include *.exe,*.msi | Copy-Item -Destination dist-build -Force
          Get-ChildItem dist-build | Format-Table Name,Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist-build/*
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist-build
          merge-multiple: true

      - name: List packaged artifacts
        run: ls -la dist-build

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-build/*
          fail_on_unmatched_files: true
