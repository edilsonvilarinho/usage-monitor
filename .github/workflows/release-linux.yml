name: Release Desktop Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v22.1.0). Must already exist on the remote.'
        required: true
        type: string

jobs:
  # Gate de testes do release. Roda em paralelo com os jobs de build (nenhum
  # deles depende deste), e so `publish-release` o exige: falha aqui deixa os
  # artefatos como artifacts do workflow, mas nenhum GitHub Release e criado.
  # Encadear os builds atras dele somaria ~4 min a todo release sem ganho.
  verify:
    # Mesmo motivo do `ci.yml`: os testes de componente Compose nunca rodaram
    # headless em Linux.
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat allTests

      # O modo /UPDATE do instalador e script NSIS: o allTests nao o executa, e a
      # unica forma de exercita-lo e compilar o instalador e roda-lo. Aqui, e nao
      # so no ci.yml, porque este e o gate que decide se um release sai -- uma
      # release com o /UPDATE quebrado atualiza a maquina de quem instalou.
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Run installer update scenarios
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\src\installer\test\Invoke-UpdateScenarios.ps1

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/**
          if-no-files-found: ignore

  build-linux:
    # GitHub's standard hosted runners no longer expose Ubuntu 20.04 directly.
    # Keep the host on 22.04, but run jpackage inside an Ubuntu 20.04 container
    # so Debian dependency resolution stays compatible with elementary OS 6.1 /
    # Ubuntu 20.04 while also avoiding 24.04-specific t64 package names.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Build focal packaging image
        run: |
          cat <<'EOF' > Dockerfile.linux-packager
          FROM eclipse-temurin:17-jdk-focal

          ENV DEBIAN_FRONTEND=noninteractive

          RUN apt-get update -qq \
            && apt-get install -y -qq \
              binutils \
              ca-certificates \
              dpkg-dev \
              fakeroot \
              libasound2 \
              libbrotli1 \
              libbsd0 \
              libc6 \
              libcups2 \
              libexpat1 \
              libfontconfig1 \
              libfreetype6 \
              libgl1 \
              libglvnd0 \
              libglx0 \
              libpng16-16 \
              libstdc++6 \
              libuuid1 \
              libx11-6 \
              libxau6 \
              libxcb1 \
              libxdmcp6 \
              libxext6 \
              libxi6 \
              libxrender1 \
              libxtst6 \
              rpm \
              tar \
              unzip \
              xdg-utils \
              xz-utils \
              zip \
              zlib1g \
              zstd \
            && rm -rf /var/lib/apt/lists/*
          EOF

          docker build -t usage-monitor-linux-packager:focal -f Dockerfile.linux-packager .

      - name: Build Linux release artifacts
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/usage-monitor-home \
            -e GRADLE_USER_HOME=/tmp/usage-monitor-gradle \
            -v "$PWD:/workspace" \
            -w /workspace \
            usage-monitor-linux-packager:focal \
            bash -lc '
              set -euo pipefail
              mkdir -p "$HOME" "$GRADLE_USER_HOME"
              ./gradlew createDistributable packageDistributionForCurrentOS
            '

      - name: Validate Debian dependencies
        run: |
          set -euo pipefail
          DEB_PATH="$(find build/compose/binaries -type f -name "*.deb" | head -n 1)"

          if [ -z "$DEB_PATH" ]; then
            echo "No .deb artifact found" >&2
            exit 1
          fi

          DEPENDS="$(dpkg-deb -f "$DEB_PATH" Depends)"
          echo "Debian depends: $DEPENDS"

          if echo "$DEPENDS" | grep -Eq 'libmd0|t64'; then
            echo "Debian package still contains Ubuntu 20.04-incompatible dependencies." >&2
            exit 1
          fi

          VERSION="${{ steps.version.outputs.VERSION }}"
          APP_ROOT="build/compose/binaries/main/app"
          APP_DIR="$APP_ROOT/Usage Monitor"
          mkdir -p dist-build

          if [ ! -d "$APP_DIR" ]; then
            echo "Expected distributable directory not found: $APP_DIR" >&2
            exit 1
          fi

          tar -C "$APP_ROOT" -czf "dist-build/usage-monitor_${VERSION}_linux_x64.tar.gz" "Usage Monitor"
          find build/compose/binaries -type f \( -name "*.deb" -o -name "*.rpm" \) -exec cp {} dist-build/ \;
          ls -la dist-build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist-build/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.6

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            $tag = '${{ inputs.tag }}'
          } else {
            $tag = $env:GITHUB_REF -replace '^refs/tags/', ''
          }
          $version = $tag -replace '^v', ''
          "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat packageMsi patchMsiLaunch packageInstaller

          $version = "${{ steps.version.outputs.VERSION }}"

          # Gate: um MSI sem o launch no ExitDialog nao pode chegar ao release.
          .\patch-msi-launch.ps1 -MsiDirectory build\compose\binaries\main\msi -MsiFileName "Usage Monitor-$version.msi" -VerifyOnly

          New-Item -ItemType Directory -Force -Path dist-build | Out-Null
          Get-ChildItem -Recurse -File build\compose\binaries -Filter *.msi | Copy-Item -Destination dist-build -Force
          Get-ChildItem -File build\installer -Filter "UsageMonitor-Setup-*.exe" | Copy-Item -Destination dist-build -Force
          Get-ChildItem dist-build | Format-Table Name,Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist-build/*
          if-no-files-found: error

  build-macos:
    # jpackage nao faz cross-compile: o .dmg so sai rodando em macOS.
    # macos-15-intel e a ultima imagem x86_64 do GitHub (disponivel ate ago/2027).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "VERSION=${TAG#v}" >> $GITHUB_OUTPUT

      - name: Build macOS release artifacts
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew packageDmg

          VERSION="${{ steps.version.outputs.VERSION }}"
          DMG_PATH="build/compose/binaries/main/dmg/Usage Monitor-${VERSION}.dmg"

          if [ ! -f "$DMG_PATH" ]; then
            echo "Expected DMG not found: $DMG_PATH" >&2
            find build/compose/binaries -type f -name "*.dmg" >&2 || true
            exit 1
          fi

          mkdir -p dist-build
          cp "$DMG_PATH" "dist-build/usage-monitor_${VERSION}_macos_${{ matrix.arch }}.dmg"
          ls -la dist-build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist-build/*
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - verify
      - build-linux
      - build-windows
      - build-macos
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist-build
          merge-multiple: true

      - name: List packaged artifacts
        run: ls -la dist-build

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            current_tag="${{ inputs.tag }}"
          else
            current_tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$current_tag" >> "$GITHUB_OUTPUT"
          git fetch --force --tags

          previous_tag="$(git tag --sort=-version:refname | grep '^v' | grep -Fxv "$current_tag" | head -n 1 || true)"
          range_spec="$current_tag"

          if [ -n "$previous_tag" ]; then
            range_spec="${previous_tag}..${current_tag}"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${current_tag}"
          fi

          commit_lines="$(
            git log --no-merges --reverse --pretty='%s|%h' "$range_spec" | while IFS='|' read -r subject short_sha; do
              if [ "$subject" = "chore: bump version to $current_tag" ]; then
                continue
              fi

              printf -- '- %s (`%s`)\n' "$subject" "$short_sha"
            done
          )"

          notes_path="$RUNNER_TEMP/release-notes.md"

          {
            echo "## Changes"
            echo

            if [ -n "$previous_tag" ]; then
              echo "- Compare: [${previous_tag}...${current_tag}](${compare_url})"
              echo
            else
              echo "- Initial release"
              echo
            fi

            if [ -n "$commit_lines" ]; then
              printf '%s\n' "$commit_lines"
            elif [ -n "$previous_tag" ]; then
              echo "- No user-facing commits were detected since ${previous_tag}."
            else
              echo "- No user-facing commits were detected for this initial release."
            fi
          } > "$notes_path"

          cat "$notes_path"
          echo "notes_path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_notes.outputs.tag }}
          body_path: ${{ steps.release_notes.outputs.notes_path }}
          files: dist-build/*
          fail_on_unmatched_files: true
