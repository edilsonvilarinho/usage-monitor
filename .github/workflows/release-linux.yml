name: Release Desktop Packages

# Release so por tag (#344). A versao vem da tag: nenhum commit de bump passa pela
# `main`, entao lancar um release nao dispara `CI` nem `CodeQL` na `main`, e este
# workflow nao espera por eles. Ele valida a tag, roda o proprio `verify` em
# paralelo com os builds, e so `publish-release` exige os dois.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v22.1.0). Must already exist on the remote.'
        required: true
        type: string
      publish:
        description: 'Publish the GitHub Release. Off = dry run: build and verify only.'
        required: false
        default: true
        type: boolean

# Duas execucoes da mesma tag nunca correm juntas, e nenhuma cancela a outra: um
# release publicado pela metade e pior que um release atrasado.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # Modelo do `akitaonrails/ai-usagebar`: antes de gastar runner de macOS, a tag
  # tem de ser `vX.Y.Z` (ou `vX.Y.Z-beta.N`, o canal beta da issue #355), anotada
  # e apontar para um commit que ja esta na `main` -- tag em branch de trabalho
  # publicaria codigo que nunca passou por PR.
  verify-version:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      tag: ${{ steps.check.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      # `true` para `-beta.N`: a release sai como prerelease e nunca vira `latest`,
      # que e o que mantem fora do canal beta quem nao optou por ele.
      prerelease: ${{ steps.check.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check tag
        id: check
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$'; then
            echo "::error::'$tag' nao e uma tag vX.Y.Z nem vX.Y.Z-beta.N"
            exit 1
          fi
          case "$tag" in
            *-beta.*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          # O checkout pode materializar a tag como leve; buscar de novo traz o
          # objeto que esta no remoto, que e o que se quer conferir.
          git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag" "refs/heads/main:refs/remotes/origin/main"
          if [ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]; then
            echo "::error::a tag '$tag' e leve; release exige tag anotada (git tag -a)"
            exit 1
          fi
          commit="$(git rev-list -n 1 "refs/tags/$tag")"
          if ! git merge-base --is-ancestor "$commit" refs/remotes/origin/main; then
            echo "::error::a tag '$tag' aponta para $commit, que nao esta na main"
            exit 1
          fi
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          {
            echo "## Release $tag"
            echo
            echo "Commit \`$commit\`, versao \`$version\`, prerelease \`$prerelease\`."
          } >> "$GITHUB_STEP_SUMMARY"

  # Gate de testes do release. Roda em paralelo com os builds (nenhum depende
  # dele) e so `publish-release` o exige: falha aqui deixa os pacotes como
  # artifacts do workflow, mas nenhum GitHub Release e criado. Sempre roda: o
  # release nao reaproveita run de outro workflow (#344).
  verify:
    needs: verify-version
    # Mesmo motivo do `ci.yml`: a suite de referencia e a do Windows.
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify-version.outputs.tag }}

      - name: Setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      # Tag so le o cache: cada tag e um ref novo, e o que ela gravasse nunca
      # seria lido de novo. Quem grava e o push na `main` do `ci.yml`, mesmo
      # runner, mesmo wrapper.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      # Mesmos forks do `ci.yml` (issue #295): `extractSkikoNative` roda antes.
      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat allTests --build-cache -PtestForks=3

      - name: Publish test summary
        if: always()
        shell: pwsh
        run: node tools/ci/test-summary.mjs --title "Release (allTests)" --glob "build/test-results/**/*.xml" --require

      # O modo /UPDATE do instalador e script NSIS: o allTests nao o executa, e a
      # unica forma de exercita-lo e compilar o instalador e roda-lo. Aqui porque
      # este e o gate que decide se um release sai.
      - name: Install NSIS
        shell: pwsh
        run: |
          if (Test-Path 'C:\Program Files (x86)\NSIS\makensis.exe') { exit 0 }
          choco install nsis -y --no-progress

      - name: Run installer update scenarios
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\src\installer\test\Invoke-UpdateScenarios.ps1

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: build/reports/tests/**
          if-no-files-found: ignore
          retention-days: 7

  build-linux:
    needs: verify-version
    # GitHub's standard hosted runners no longer expose Ubuntu 20.04 directly.
    # Keep the host on 22.04, but run jpackage inside an Ubuntu 20.04 container
    # so Debian dependency resolution stays compatible with elementary OS 6.1 /
    # Ubuntu 20.04 while also avoiding 24.04-specific t64 package names.
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify-version.outputs.tag }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build focal packaging image
        run: |
          cat <<'EOF' > Dockerfile.linux-packager
          FROM eclipse-temurin:17-jdk-focal

          ENV DEBIAN_FRONTEND=noninteractive

          RUN apt-get update -qq \
            && apt-get install -y -qq \
              binutils \
              ca-certificates \
              dpkg-dev \
              fakeroot \
              libasound2 \
              libbrotli1 \
              libbsd0 \
              libc6 \
              libcups2 \
              libexpat1 \
              libfontconfig1 \
              libfreetype6 \
              libgl1 \
              libglvnd0 \
              libglx0 \
              libpng16-16 \
              libstdc++6 \
              libuuid1 \
              libx11-6 \
              libxau6 \
              libxcb1 \
              libxdmcp6 \
              libxext6 \
              libxi6 \
              libxrender1 \
              libxtst6 \
              rpm \
              tar \
              unzip \
              xdg-utils \
              xz-utils \
              zip \
              zlib1g \
              zstd \
            && rm -rf /var/lib/apt/lists/*
          EOF

          docker build -t usage-monitor-linux-packager:focal -f Dockerfile.linux-packager .

      - name: Build Linux release artifacts
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/usage-monitor-home \
            -e GRADLE_USER_HOME=/tmp/usage-monitor-gradle \
            -e APP_VERSION="${{ needs.verify-version.outputs.version }}" \
            -v "$PWD:/workspace" \
            -w /workspace \
            usage-monitor-linux-packager:focal \
            bash -lc '
              set -euo pipefail
              mkdir -p "$HOME" "$GRADLE_USER_HOME"
              ./gradlew createDistributable packageDistributionForCurrentOS -PappVersion="$APP_VERSION"
            '

      - name: Validate Debian dependencies
        run: |
          set -euo pipefail
          DEB_PATH="$(find build/compose/binaries -type f -name "*.deb" | head -n 1)"

          if [ -z "$DEB_PATH" ]; then
            echo "No .deb artifact found" >&2
            exit 1
          fi

          DEPENDS="$(dpkg-deb -f "$DEB_PATH" Depends)"
          echo "Debian depends: $DEPENDS"

          if echo "$DEPENDS" | grep -Eq 'libmd0|t64'; then
            echo "Debian package still contains Ubuntu 20.04-incompatible dependencies." >&2
            exit 1
          fi

          VERSION="${{ needs.verify-version.outputs.version }}"
          APP_ROOT="build/compose/binaries/main/app"
          APP_DIR="$APP_ROOT/Usage Monitor"
          mkdir -p dist-build

          if [ ! -d "$APP_DIR" ]; then
            echo "Expected distributable directory not found: $APP_DIR" >&2
            exit 1
          fi

          tar -C "$APP_ROOT" -czf "dist-build/usage-monitor_${VERSION}_linux_x64.tar.gz" "Usage Monitor"
          find build/compose/binaries -type f \( -name "*.deb" -o -name "*.rpm" \) -exec cp {} dist-build/ \;
          ls -la dist-build

      # O tarball deixou de ser so um anexo de conveniencia: e o pacote que a
      # atualizacao automatica do Linux extrai e promove. Um `.tar.gz` com duas
      # raizes, com um link, ou sem o bit de execucao no launcher chega ao
      # usuario e so falha DEPOIS do swap, quando o app ja nao esta de pe para
      # relatar. As mesmas guardas do `TarballExtractor`, do lado de ca.
      - name: Validate the Linux tarball
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-version.outputs.version }}"
          TARBALL="usage-monitor_${VERSION}_linux_x64.tar.gz"
          TAR_PATH="dist-build/$TARBALL"

          tar -tvzf "$TAR_PATH" > listing.txt
          # As colunas de `tar -tv` sao separadas por espaco e o nome da raiz tem
          # um: `$NF` recortava `Usage Monitor/bin/...` em `Monitor/bin/...` e a
          # checagem de raiz unica nunca poderia passar. Os nomes crus vem do
          # `-t` sem `-v`, que nao tem coluna nenhuma antes deles.
          tar -tzf "$TAR_PATH" > names.txt

          roots="$(cut -d/ -f1 names.txt | sort -u)"
          if [ "$roots" != "Usage Monitor" ]; then
            echo "Expected a single 'Usage Monitor' root, found:" >&2
            echo "$roots" >&2
            exit 1
          fi

          # Coluna de modo do `tar -tv`: `-` para arquivo comum, `d` para
          # diretorio. Qualquer outra letra e link, device, fifo ou socket.
          bad_types="$(awk '{ print substr($1, 1, 1) }' listing.txt | sort -u | grep -v '^[-d]$' || true)"
          if [ -n "$bad_types" ]; then
            echo "The tarball contains entry types that are not files or directories: $bad_types" >&2
            exit 1
          fi

          launcher_mode="$(awk '$0 ~ /Usage Monitor\/bin\/Usage Monitor$/ { print $1 }' listing.txt)"
          if [ "$launcher_mode" != "-rwxr-xr-x" ]; then
            echo "Expected 'Usage Monitor/bin/Usage Monitor' with mode 0755, found '$launcher_mode'." >&2
            exit 1
          fi

          echo "Tarball: $(wc -l < listing.txt) entries, single root, no links, launcher 0755."
          rm -f listing.txt names.txt

      # O SHA-256 daqui serve SO ao instalador inicial: ele nao fala com a API do
      # GitHub. Quem se atualiza sozinho usa o campo `digest` da release, que
      # cobre o mesmo arquivo sem ninguem ter de recalcular nada.
      - name: Generate the user-space installer
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-version.outputs.version }}"
          TARBALL="usage-monitor_${VERSION}_linux_x64.tar.gz"
          SHA256="$(sha256sum "dist-build/$TARBALL" | cut -d' ' -f1)"
          INSTALLER="dist-build/install-usage-monitor_${VERSION}_linux_x64.sh"

          sed \
            -e "s|@VERSION@|${VERSION}|g" \
            -e "s|@TARBALL@|${TARBALL}|g" \
            -e "s|@SHA256@|${SHA256}|g" \
            src/installer/linux/install-usage-monitor.sh.template > "$INSTALLER"

          # Placeholder sobrado significa template e workflow fora de sincronia,
          # e o instalador sairia baixando a URL literal `@TARBALL@`.
          if grep -qE '@[A-Z0-9_]+@' "$INSTALLER"; then
            echo "The installer still has unreplaced placeholders:" >&2
            grep -nE '@[A-Z0-9_]+@' "$INSTALLER" >&2
            exit 1
          fi

          sh -n "$INSTALLER"
          chmod 0755 "$INSTALLER"
          echo "Installer: $INSTALLER (tarball sha256 $SHA256)"
          ls -la dist-build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-linux
          path: dist-build/*
          if-no-files-found: error

  build-windows:
    needs: verify-version
    runs-on: windows-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify-version.outputs.tag }}

      - name: Setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      # `gradle/gradle-build-action` esta deprecated (sucessora e
      # `gradle/actions/setup-gradle`, ja usada em `ci.yml`). `gradle-version`
      # saiu por ser redundante: `gradle-wrapper.properties` ja fixa a versao, e
      # `gradlew.bat` usa a propria distribuicao do wrapper.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y

      # O passo "Extract version" saiu junto do MSI: o unico leitor dele neste job
      # era o gate do patch-msi-launch. O nome do Setup.exe vem da versao do
      # Gradle, e o Copy-Item usa curinga.
      - name: Build Windows release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat packageInstaller "-PappVersion=${{ needs.verify-version.outputs.version }}"

          New-Item -ItemType Directory -Force -Path dist-build | Out-Null
          Get-ChildItem -File build\installer -Filter "UsageMonitor-Setup-*.exe" | Copy-Item -Destination dist-build -Force
          Get-ChildItem dist-build | Format-Table Name,Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-windows
          path: dist-build/*
          if-no-files-found: error

  build-macos:
    # jpackage nao faz cross-compile: o .dmg so sai rodando em macOS.
    # macos-15-intel e a ultima imagem x86_64 do GitHub (disponivel ate ago/2027).
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64

    needs: verify-version
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify-version.outputs.tag }}

      - name: Setup JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'

      # `setup-java cache: 'gradle'` gravava ~0,5 GB por release num escopo de tag
      # que nenhum run seguinte le (cada tag e um ref novo), e empurrava o cache
      # do repositorio acima dos 10 GB -- despejando o cache da `main` que deixa o
      # PR rapido (#344). Tag so le, como o `build-windows`.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Build macOS release artifacts
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew packageDmg -PappVersion="${{ needs.verify-version.outputs.version }}"

          VERSION="${{ needs.verify-version.outputs.version }}"
          # O jpackage do Dmg so aceita numero: a beta sai com o numero-base no
          # nome (`build.gradle.kts`, `packageBaseVersion`), e o artefato publicado
          # recupera a versao completa no `cp` abaixo.
          DMG_PATH="build/compose/binaries/main/dmg/Usage Monitor-${VERSION%%-*}.dmg"

          if [ ! -f "$DMG_PATH" ]; then
            echo "Expected DMG not found: $DMG_PATH" >&2
            find build/compose/binaries -type f -name "*.dmg" >&2 || true
            exit 1
          fi

          mkdir -p dist-build
          cp "$DMG_PATH" "dist-build/usage-monitor_${VERSION}_macos_${{ matrix.arch }}.dmg"
          ls -la dist-build

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: dist-build/*
          if-no-files-found: error

  publish-release:
    # `inputs.publish` so existe no disparo manual; o push da tag sempre publica.
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    needs:
      - verify-version
      - verify
      - build-linux
      - build-windows
      - build-macos
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify-version.outputs.tag }}
          fetch-depth: 0

      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: dist-build
          merge-multiple: true

      - name: List packaged artifacts
        run: ls -la dist-build

      - name: Generate release notes
        id: release_notes
        shell: bash
        run: |
          set -euo pipefail

          current_tag="${{ needs.verify-version.outputs.tag }}"
          echo "tag=$current_tag" >> "$GITHUB_OUTPUT"
          git fetch --force --tags

          # Canal beta (issue #355). `versionsort.suffix=-` ordena `v42.0.0-beta.1`
          # ANTES de `v42.0.0` -- sem ele o git poe a beta depois da estavel e a nota
          # da estavel sairia contra a propria beta. A anterior e a tag logo abaixo
          # da atual nessa ordem: para a estavel, so entre estaveis (a nota lista a
          # serie beta inteira); para a beta, entre todas (a nota lista o que mudou
          # desde a beta ou estavel anterior).
          all_tags="$(git -c versionsort.suffix=- tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$' || true)"
          if [ "${{ needs.verify-version.outputs.prerelease }}" = "true" ]; then
            candidate_tags="$all_tags"
          else
            candidate_tags="$(printf '%s\n' "$all_tags" | grep -Ev -- '-beta\.' || true)"
          fi
          previous_tag="$(printf '%s\n' "$candidate_tags" | awk -v cur="$current_tag" 'found && NF { print; exit } $0 == cur { found = 1 }')"
          range_spec="$current_tag"

          if [ -n "$previous_tag" ]; then
            range_spec="${previous_tag}..${current_tag}"
            compare_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...${current_tag}"
          fi

          commit_lines="$(
            git log --no-merges --reverse --pretty='%s|%h' "$range_spec" | while IFS='|' read -r subject short_sha; do
              # Ate a v41.3.1 cada release tinha commit de bump na `main`; desde a
              # #344 a versao vem da tag, e o filtro so limpa intervalos antigos.
              case "$subject" in
                "chore: release v"*|"chore: bump version to "*) continue ;;
              esac

              printf -- '- %s (`%s`)\n' "$subject" "$short_sha"
            done
          )"

          notes_path="$RUNNER_TEMP/release-notes.md"

          {
            echo "## Changes"
            echo

            if [ -n "$previous_tag" ]; then
              echo "- Compare: [${previous_tag}...${current_tag}](${compare_url})"
              echo
            else
              echo "- Initial release"
              echo
            fi

            if [ -n "$commit_lines" ]; then
              printf '%s\n' "$commit_lines"
            elif [ -n "$previous_tag" ]; then
              echo "- No user-facing commits were detected since ${previous_tag}."
            else
              echo "- No user-facing commits were detected for this initial release."
            fi
          } > "$notes_path"

          cat "$notes_path"
          echo "notes_path=$notes_path" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.release_notes.outputs.tag }}
          body_path: ${{ steps.release_notes.outputs.notes_path }}
          files: dist-build/*
          fail_on_unmatched_files: true
          # Beta sai como prerelease e nunca vira `latest` (issue #355): o app fora do
          # canal beta so le `/releases/latest`, que a API nunca responde com
          # prerelease -- e isso que protege quem nao optou, inclusive versoes
          # antigas do app, que nao conhecem o canal.
          prerelease: ${{ needs.verify-version.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.verify-version.outputs.prerelease == 'true' && 'false' || 'true' }}
