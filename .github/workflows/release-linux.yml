name: Release Linux Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fakeroot rpm

      - name: Build Linux release artifacts
        run: |
          set -euo pipefail
          ./gradlew createDistributable packageDistributionForCurrentOS

          VERSION="${{ steps.version.outputs.VERSION }}"
          APP_ROOT="build/compose/binaries/main/app"
          APP_DIR="$APP_ROOT/Usage Monitor"
          mkdir -p dist-build

          if [ ! -d "$APP_DIR" ]; then
            echo "Expected distributable directory not found: $APP_DIR" >&2
            exit 1
          fi

          tar -C "$APP_ROOT" -czf "dist-build/usage-monitor_${VERSION}_linux_x64.tar.gz" "Usage Monitor"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist-build/*.tar.gz
            build/compose/binaries/**/*.deb
            build/compose/binaries/**/*.rpm
