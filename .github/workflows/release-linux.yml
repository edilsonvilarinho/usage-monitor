name: Release Desktop Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    # GitHub's standard hosted runners no longer expose Ubuntu 20.04 directly.
    # Keep the host on 22.04, but run jpackage inside an Ubuntu 20.04 container
    # so Debian dependency resolution stays compatible with elementary OS 6.1 /
    # Ubuntu 20.04 while also avoiding 24.04-specific t64 package names.
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build focal packaging image
        run: |
          cat <<'EOF' > Dockerfile.linux-packager
          FROM ubuntu:20.04

          ENV DEBIAN_FRONTEND=noninteractive

          RUN apt-get update -qq \
            && apt-get install -y -qq \
              binutils \
              ca-certificates \
              dpkg-dev \
              fakeroot \
              libasound2 \
              libbrotli1 \
              libbsd0 \
              libc6 \
              libcups2 \
              libexpat1 \
              libfontconfig1 \
              libfreetype6 \
              libgl1 \
              libglvnd0 \
              libglx0 \
              libpng16-16 \
              libstdc++6 \
              libuuid1 \
              libx11-6 \
              libxau6 \
              libxcb1 \
              libxdmcp6 \
              libxext6 \
              libxi6 \
              libxrender1 \
              libxtst6 \
              rpm \
              tar \
              unzip \
              xdg-utils \
              xz-utils \
              zip \
              zlib1g \
              zstd \
            && rm -rf /var/lib/apt/lists/*
          EOF

          docker build -t usage-monitor-linux-packager:focal -f Dockerfile.linux-packager .

      - name: Build Linux release artifacts
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/usage-monitor-home \
            -e GRADLE_USER_HOME=/tmp/usage-monitor-gradle \
            -e JAVA_HOME=/opt/java/openjdk \
            -e PATH=/opt/java/openjdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            -v "$PWD:/workspace" \
            -v "$JAVA_HOME:/opt/java/openjdk:ro" \
            -w /workspace \
            usage-monitor-linux-packager:focal \
            bash -lc '
              set -euo pipefail
              mkdir -p "$HOME" "$GRADLE_USER_HOME"
              ./gradlew createDistributable packageDistributionForCurrentOS
            '

      - name: Validate Debian dependencies
        run: |
          set -euo pipefail
          DEB_PATH="$(find build/compose/binaries -type f -name "*.deb" | head -n 1)"

          if [ -z "$DEB_PATH" ]; then
            echo "No .deb artifact found" >&2
            exit 1
          fi

          DEPENDS="$(dpkg-deb -f "$DEB_PATH" Depends)"
          echo "Debian depends: $DEPENDS"

          if echo "$DEPENDS" | grep -Eq 'libmd0|t64'; then
            echo "Debian package still contains Ubuntu 20.04-incompatible dependencies." >&2
            exit 1
          fi

          VERSION="${{ steps.version.outputs.VERSION }}"
          APP_ROOT="build/compose/binaries/main/app"
          APP_DIR="$APP_ROOT/Usage Monitor"
          mkdir -p dist-build

          if [ ! -d "$APP_DIR" ]; then
            echo "Expected distributable directory not found: $APP_DIR" >&2
            exit 1
          fi

          tar -C "$APP_ROOT" -czf "dist-build/usage-monitor_${VERSION}_linux_x64.tar.gz" "Usage Monitor"
          find build/compose/binaries -type f \( -name "*.deb" -o -name "*.rpm" \) -exec cp {} dist-build/ \;
          ls -la dist-build

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist-build/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.6

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF -replace '^refs/tags/v', ''
          "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Build Windows release artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat createDistributable packageDistributionForCurrentOS

          $version = "${{ steps.version.outputs.VERSION }}"
          $appRoot = "build\compose\binaries\main\app"
          $appDir = Join-Path $appRoot "Usage Monitor"

          New-Item -ItemType Directory -Force -Path dist-build | Out-Null

          if (-not (Test-Path $appDir)) {
            throw "Expected distributable directory not found: $appDir"
          }

          Compress-Archive -Path "$appDir\*" -DestinationPath "dist-build\usage-monitor_${version}_windows_x64.zip" -Force
          Get-ChildItem -Recurse -File build\compose\binaries -Include *.exe,*.msi | Copy-Item -Destination dist-build -Force
          Get-ChildItem dist-build | Format-Table Name,Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist-build/*
          if-no-files-found: error

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
    permissions:
      contents: write

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist-build
          merge-multiple: true

      - name: List packaged artifacts
        run: ls -la dist-build

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-build/*
          fail_on_unmatched_files: true
