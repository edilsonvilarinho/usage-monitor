# Grava o app real (release publicado ou build do código) num runner Windows
# e reprova pulsos de janela na HUD: parado (floating e docked) e um hover. Fora do `ci-ok`.
# Ver docs/planos/app-real-no-ci-652-execucao.md e docs/planos/gravacao-hud-pr-657-execucao.md.
# Manual: Actions > Real app recording > Run workflow. PR que mexe na HUD: `source`, 1 tentativa, todos os cenários.
name: Real app recording

on:
  pull_request:
    paths:
      - 'src/desktopMain/**/Hud*.kt'
      - 'src/desktopMain/**/*Window*.kt'
      - 'src/desktopMain/**/*Frame*.kt'
      - 'src/desktopMain/**/presentation/ui/Hud*.kt'
      - 'src/commonMain/**/AppGargantua*.kt'
      - 'src/commonMain/**/Hud*.kt'
      - 'tools/real-app/**'
      - 'tools/ci/hud-pulses.mjs'
      - '.github/workflows/real-app.yml'
  workflow_dispatch:
    inputs:
      versions:
        description: 'Tags de release ou `source` (build do código), separados por vírgula (ex.: v42.3.0-beta.15,v42.3.0-beta.16,source)'
        required: true
        default: 'v42.3.0-beta.15,v42.3.0-beta.16,source'
        type: string
      attempts:
        description: 'Quantas tentativas por versão'
        required: true
        default: '5'
        type: string
      scenarios:
        description: '`all` ou lista separada por vírgula: floating-idle, docked-top-idle, docked-bottom-idle, docked-left-idle, docked-right-idle, docked-top-hover, floating-drag, docked-top-hole-idle, docked-top-hole-hover'
        required: true
        default: 'all'
        type: string

permissions:
  contents: read

concurrency:
  group: real-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      versions: ${{ steps.plan.outputs.versions }}
      attempts: ${{ steps.plan.outputs.attempts }}
      scenarios: ${{ steps.plan.outputs.scenarios }}
    steps:
      - name: Expand versions, attempts and scenarios into matrix lists
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSIONS: ${{ inputs.versions || 'v42.3.0-beta.15,v42.3.0-beta.16,source' }}
          ATTEMPTS: ${{ inputs.attempts || '5' }}
          SCENARIOS: ${{ inputs.scenarios || 'all' }}
        run: |
          set -euo pipefail
          # Pull requests record the source build once, with every scenario.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            VERSIONS=source
            ATTEMPTS=1
            SCENARIOS=all
          fi
          ALL='floating-idle,docked-top-idle,docked-bottom-idle,docked-left-idle,docked-right-idle,docked-top-hover,floating-drag,docked-top-hole-idle,docked-top-hole-hover'
          if [ "$SCENARIOS" = "all" ]; then SCENARIOS=$ALL; fi
          scenarios=$(printf '%s' "$SCENARIOS" | tr -d ' ')
          for s in $(printf '%s' "$scenarios" | tr ',' ' '); do
            case ",$ALL," in
              *",$s,"*) ;;
              *) echo "unknown scenario: $s" >&2; exit 1 ;;
            esac
          done
          versions=$(printf '%s' "$VERSIONS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$' \
            | jq -R . | jq -sc .)
          attempts=$(seq 1 "$ATTEMPTS" | jq -sc .)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "attempts=$attempts" >> "$GITHUB_OUTPUT"
          echo "scenarios=$scenarios" >> "$GITHUB_OUTPUT"
          echo "versions=$versions attempts=$attempts scenarios=$scenarios"

  record:
    needs: plan
    runs-on: windows-latest
    # The source case compiles the app with Gradle, so it gets more time than a tag download.
    timeout-minutes: ${{ matrix.version == 'source' && 60 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
        attempt: ${{ fromJSON(needs.plan.outputs.attempts) }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ matrix.version }}
      ATTEMPT: ${{ matrix.attempt }}
      SCENARIOS: ${{ needs.plan.outputs.scenarios }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Setup Java (source only, as in the desktop-windows job of ci.yml)
        if: matrix.version == 'source'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle (source only, as in ci.yml)
        if: matrix.version == 'source'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Set data and output paths
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "DATA_DIR=$(Join-Path $env:RUNNER_TEMP 'real-app-data')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "OUT_DIR=$(Join-Path $env:GITHUB_WORKSPACE 'out')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download the published installer
        if: matrix.version != 'source'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'installer'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download $env:RELEASE_VERSION --repo $env:GITHUB_REPOSITORY `
            --pattern "UsageMonitor-Setup-$($env:RELEASE_VERSION.TrimStart('v')).exe" --dir $dir
          Get-ChildItem -LiteralPath $dir | Select-Object Name, Length

      - name: Install silently (per user, /S does not open the app)
        if: matrix.version != 'source'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem -LiteralPath (Join-Path $env:RUNNER_TEMP 'installer') -Filter '*.exe' | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Usage Monitor\Usage Monitor.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "installed exe not found: $exe" }
          "APP_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build the app from source (source only)
        if: matrix.version == 'source'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          .\gradlew.bat createDistributable
          if ($LASTEXITCODE -ne 0) { throw "gradlew createDistributable exit code $LASTEXITCODE" }
          # jpackage app-image folder (build.gradle.kts:531, packageName 'Usage Monitor' at :160).
          $exe = Join-Path $env:GITHUB_WORKSPACE 'build\compose\binaries\main\app\Usage Monitor\Usage Monitor.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "built exe not found: $exe" }
          "APP_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Compiled version (build.gradle.kts:220-228, CURRENT_APP_VERSION in the generated AppVersion.kt).
          $versionFile = Join-Path $env:GITHUB_WORKSPACE 'build\generated\app-version\desktopMain\kotlin\com\usagemonitor\AppVersion.kt'
          $match = [regex]::Match((Get-Content -LiteralPath $versionFile -Raw), 'CURRENT_APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "CURRENT_APP_VERSION not found in $versionFile" }
          "SEED_VERSION=$($match.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "compiled app version: $($match.Groups[1].Value)"

      - name: Seed version for tags (the release tag)
        if: matrix.version != 'source'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "SEED_VERSION=$($env:RELEASE_VERSION)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Block outbound network for the app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-NetFirewallRule -DisplayName 'real-app-652 block outbound' -Direction Outbound `
            -Program $env:APP_EXE -Action Block -Profile Any | Out-Null

      - name: Seed, record and judge each scenario
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $summary = $env:GITHUB_STEP_SUMMARY
          $title = "### real-app $env:RELEASE_VERSION (attempt $env:ATTEMPT)"
          $rows = [System.Collections.Generic.List[string]]::new()
          $details = [System.Collections.Generic.List[string]]::new()
          $failed = 0
          $fence = '```'
          foreach ($scenario in ($env:SCENARIOS -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })) {
              $dataDir = Join-Path $env:DATA_DIR $scenario
              $outDir = Join-Path $env:OUT_DIR $scenario
              New-Item -ItemType Directory -Force -Path $outDir | Out-Null
              # The previous scenario's app must be gone before the next one starts.
              Get-Process -Name 'Usage Monitor' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue

              # beta.15 opens the HUD by itself at start (the known defect); every other version must not.
              $expected = 'ok'
              if ($env:RELEASE_VERSION -eq 'v42.3.0-beta.15') {
                  $expected = if ($scenario -like '*-hover') { 'extra-pulse' } elseif ($scenario -eq 'floating-drag') { 'ok' } else { 'pulsed' }
              }

              $obtained = 'none'
              $recorded = $false
              if ($env:APP_EXE) {
                  pwsh -NoProfile -File tools/real-app/seed.ps1 -DataDir $dataDir -Version $env:SEED_VERSION -Scenario $scenario | Out-Null
                  if ($LASTEXITCODE -eq 0) {
                      pwsh -NoProfile -File tools/real-app/record.ps1 -Exe $env:APP_EXE -DataDir $dataDir -OutDir $outDir -Seconds 30 -Scenario $scenario
                      $recorded = ($LASTEXITCODE -eq 0)
                  }
              }

              $csv = Join-Path $outDir 'frames.csv'
              $verdictPath = Join-Path $outDir 'verdict.txt'
              $isHover = $scenario -like '*-hover'
              $isDrag = $scenario -eq 'floating-drag'
              $eventsPath = Join-Path $outDir 'events.json'
              if (-not $recorded -or -not (Test-Path -LiteralPath $csv)) {
                  $obtained = 'none'
              } elseif (($isHover -or $isDrag) -and -not (Test-Path -LiteralPath $eventsPath)) {
                  $obtained = 'no-events'
              } else {
                  $detectorArgs = @($csv)
                  if ($isHover) {
                      $ev = Get-Content -LiteralPath $eventsPath -Raw | ConvertFrom-Json
                      $eventsArg = [pscustomobject]@{ enterMs = $ev.enterMs; leaveMs = $ev.leaveMs } | ConvertTo-Json -Compress
                      $detectorArgs += @('--expect', 'hover', '--events', $eventsArg)
                  } elseif ($isDrag) {
                      # The whole events.json: pressMs, releaseMs, dx, dy.
                      $eventsArg = (Get-Content -LiteralPath $eventsPath -Raw).Trim()
                      $detectorArgs += @('--expect', 'drag', '--events', $eventsArg)
                  }
                  node tools/ci/hud-pulses.mjs @detectorArgs *> $verdictPath
                  $code = $LASTEXITCODE
                  $obtained = (Get-Content -LiteralPath $verdictPath -TotalCount 1)
                  $details.Add("$scenario (detector exit $code)`n$fence`n$(Get-Content -LiteralPath $verdictPath -Raw)$fence")
              }

              $matched = ($recorded -and ($obtained -eq $expected)).ToString().ToLower()
              if ($matched -eq 'false') { $failed++ }
              $rows.Add("| $scenario | $expected | $obtained | $matched |")
              "$scenario expected: $expected obtained: $obtained matched: $matched"
          }

          $table = @("$title", '', '| Scenario | Expected | Obtained | Matched |', '|---|---|---|---|') + $rows
          ($table -join "`n") + "`n" | Out-File -FilePath $summary -Append -Encoding utf8
          if ($details.Count -gt 0) { ($details -join "`n") + "`n" | Out-File -FilePath $summary -Append -Encoding utf8 }
          if ($failed -gt 0) {
              "$failed scenario(s) differ from the expectation or did not record"
              exit 1
          }
          # The detector's last exit code would otherwise become the step's.
          exit 0

      - name: Upload the recording
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: real-app-${{ matrix.version }}-attempt-${{ matrix.attempt }}
          path: out
          retention-days: 7
          if-no-files-found: warn
