name: CodeQL

# So na main e semanalmente, nao em pull_request: e escaneamento de
# seguranca (SAST), nao gate de merge, e o repositorio ja e cauteloso com
# tempo de CI em PR (issue #93). Pode entrar em pull_request depois, se o
# tempo do job se provar aceitavel na pratica.
on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write
      actions: read

    strategy:
      fail-fast: false
      matrix:
        include:
          # `build-mode: none` nao serve para Kotlin: a extracao do
          # extractor java-kotlin exige compilacao real, e com "none" o
          # Kotlin some da analise em silencio, so com um aviso na saida
          # (documentado pela propria GitHub) -- exatamente o "verde que nao
          # fez nada" que a issue #93 existe para impedir aqui.
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup JDK
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@6f5948dfacef28e207b48d0905cf90c03365536d # v3.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # Compila sem rodar teste. `autobuild` chamaria `gradlew build`, que
      # arrasta `check`/`test` -- e os testes de componente Compose nunca
      # rodaram headless em Linux (nenhuma configuracao de xvfb no
      # repositorio). `compileKotlinDesktop` ja compila com sucesso em
      # Ubuntu hoje: e o mesmo runner do job `build-linux` do release.
      - name: Build (java-kotlin)
        if: matrix.language == 'java-kotlin'
        run: |
          chmod +x ./gradlew
          ./gradlew compileKotlinDesktop --console=plain

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:${{ matrix.language }}"
