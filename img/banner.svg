<!-- Banner do README (rodada G5 da skill usage-monitor-visual-options). Toca uma vez e para no quadro final; prefers-reduced-motion mostra direto o quadro final. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 220" width="880" height="220" role="img" aria-label="Usage Monitor — Quotas, usage and cost of every AI coding tool you pay for.">
<style>
.g5ttl{font:600 40px ui-monospace,'SFMono-Regular','Cascadia Mono',Consolas,'Liberation Mono',monospace;letter-spacing:-.5px}
.g5sub{font:400 14px ui-monospace,'SFMono-Regular','Cascadia Mono',Consolas,'Liberation Mono',monospace;fill:#BFA98A}
.g5chip{font:400 11px ui-monospace,'SFMono-Regular','Cascadia Mono',Consolas,'Liberation Mono',monospace;fill:#8E8171}
.g5a{transform-box:view-box;transform-origin:0 0}
.g5t{animation:g5f 360ms ease-out both}
@keyframes g5f{0%{opacity:0}100%{opacity:1}}
.g5line{stroke-dasharray:790;animation:g5line 1500ms cubic-bezier(.45,.05,.35,1) both}
@keyframes g5line{0%{stroke-dashoffset:790}100%{stroke-dashoffset:0}}
.g5head{opacity:0;animation:g5head 1750ms cubic-bezier(.45,.05,.35,1) both}
@keyframes g5head{0%{transform:translateX(0);opacity:1}86%{transform:translateX(790px);opacity:1}100%{transform:translateX(790px);opacity:0}}
.g5end{animation:g5f 300ms ease-out 1500ms both}
.g5c{animation:g5c 300ms ease-out both}
@keyframes g5c{0%{opacity:.15;fill:#8E8171}40%{opacity:1;fill:#FFF0CB}100%{opacity:1;fill:#8E8171}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<defs>
<linearGradient id="g5bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0D0F15"/><stop offset="1" stop-color="#030508"/></linearGradient>
<linearGradient id="g5disk" x1="0" x2="1"><stop offset="0" stop-color="#B4501E" stop-opacity=".35"/><stop offset=".5" stop-color="#E8AE63" stop-opacity=".85"/><stop offset="1" stop-color="#FFF0CB"/></linearGradient>
<radialGradient id="g5glow"><stop offset=".3" stop-color="#E8AE63" stop-opacity=".24"/><stop offset="1" stop-color="#E8AE63" stop-opacity="0"/></radialGradient>
<radialGradient id="g5flash"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".3" stop-color="#FFF0CB" stop-opacity=".7"/><stop offset="1" stop-color="#E8AE63" stop-opacity="0"/></radialGradient>
<linearGradient id="g5title" x1="0" x2="1"><stop offset="0" stop-color="#FFF0CB"/><stop offset="1" stop-color="#E8AE63"/></linearGradient>
<linearGradient id="g5jet" x1="0" x2="1"><stop offset="0" stop-color="#FFF0CB"/><stop offset=".35" stop-color="#E8AE63" stop-opacity=".7"/><stop offset="1" stop-color="#E8AE63" stop-opacity="0"/></linearGradient>
<linearGradient id="g5ion" x1="0" x2="1"><stop offset="0" stop-color="#42A5F5" stop-opacity="0"/><stop offset=".75" stop-color="#9FD3FF" stop-opacity=".55"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
</defs>
